name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python manage.py check --settings=newpjt.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=newpjt.test_settings
      - run: python manage.py test --settings=newpjt.test_settings
      - run: node --test tests/quiz-state.test.mjs
